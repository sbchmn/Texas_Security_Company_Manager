name: texas-security-company-manager
services:
  - name: web
    github:
      repo: sbchmn/Texas_Security_Company_Manager
      branch: main
      deploy_on_push: true
    dockerfile_path: Dockerfile
    source_dir: /
    http_port: 8000
    instance_count: 1
    health_check:
      http_path: /readyz
    routes:
      - path: /
    envs:
      - key: SECRET_KEY
        type: SECRET
      - key: TRUST_PROXY_SSL_HEADER
        value: "true"
      # The container is only reachable through the App Platform edge, so the forwarded
      # client address is trusted from any peer. Without this the login throttle buckets
      # every visitor together behind the edge address.
      - key: TRUSTED_PROXIES
        value: "0.0.0.0/0"
      # Set for a public hostname so a cross-origin form post cannot reach the app.
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://${APP_DOMAIN}"
      - key: ALLOWED_HOSTS
        value: ${APP_DOMAIN}
      - key: PUBLIC_BASE_URL
        value: "https://${APP_DOMAIN}"
      - key: MYSQL_HOST
        value: ${tscm-db.HOSTNAME}
      - key: MYSQL_PORT
        value: ${tscm-db.PORT}
      - key: MYSQL_DATABASE
        value: ${tscm-db.DATABASE}
      - key: MYSQL_USER
        value: ${tscm-db.USERNAME}
      - key: MYSQL_PASSWORD
        value: ${tscm-db.PASSWORD}
      # Verify the managed cluster's certificate (the driver alone would accept any certificate).
      - key: MYSQL_SSL_CA_PEM
        value: ${tscm-db.CA_CERT}
      - key: MYSQL_SSL_MODE
        value: verify_identity
      - key: REDIS_URL
        value: ${tscm-cache.DATABASE_URL}
      # App Platform has no ClamAV sidecar (the scanner is not an HTTP service), so this
      # spec ships in basic mode: signature/MIME validation and the EICAR check only.
      # Before holding real personnel records, either point CLAMAV_HOST at a scanner on
      # your VPC and set MALWARE_SCAN_MODE=clamav, or keep documents out of production.
      - key: MALWARE_SCAN_MODE
        value: basic
      - key: CLAMAV_HOST
        value: ""
      - key: CLAMAV_PORT
        value: "3310"
      # Container filesystems on App Platform are ephemeral: without object storage every
      # personnel document and logo is lost on the next deploy. Replace these three values
      # with your Spaces bucket, endpoint, and region before deploying.
      - key: AWS_STORAGE_BUCKET_NAME
        value: replace-with-your-spaces-bucket
      - key: AWS_S3_ENDPOINT_URL
        value: https://replace-with-your-space-region.digitaloceanspaces.com
      - key: AWS_S3_REGION_NAME
        value: replace-with-your-space-region
      - key: AWS_ACCESS_KEY_ID
        type: SECRET
      - key: AWS_SECRET_ACCESS_KEY
        type: SECRET
      - key: DEFAULT_FROM_EMAIL
        value: alerts@example.com
      # One provider is active per installation; set the matching API secret in the
      # App Platform console (SECRET envs are never stored in this file).
      - key: POSTMARK_SERVER_TOKEN
        type: SECRET
      - key: MAILJET_API_KEY
        type: SECRET
      - key: MAILJET_SECRET_KEY
        type: SECRET
      # Text messages. Leave unset to send email only.
      - key: TWILIO_ACCOUNT_SID
        type: SECRET
      - key: TWILIO_AUTH_TOKEN
        type: SECRET
      - key: TWILIO_FROM_NUMBER
        value: ""
      # Flip to "1" for the first deploy to create the initial organization and owner from
      # the BOOTSTRAP_* settings below, then set it back to "0".
      - key: RUN_BOOTSTRAP
        value: "0"
      - key: BOOTSTRAP_EMAIL
        value: owner@example.com
      - key: BOOTSTRAP_PASSWORD
        type: SECRET
      - key: BOOTSTRAP_COMPANY
        value: Lone Star Security
      - key: BOOTSTRAP_SLUG
        value: lone-star-security
databases:
  # Both entries attach clusters you create first under Databases in the control panel: App
  # Platform only provisions dev databases itself, and those are PostgreSQL. cluster_name is the
  # cluster's name exactly as the control panel shows it. Attaching adds the app as a trusted source.
  - name: tscm-db
    engine: MYSQL
    production: true
    cluster_name: replace-with-your-mysql-cluster-name
    # Create this database and user on the cluster (Users & Databases tab) before deploying.
    db_name: tscm
    db_user: tscm
  - name: tscm-cache
    engine: VALKEY
    production: true
    cluster_name: replace-with-your-valkey-cluster-name

workers:
  - name: notifications
    github:
      repo: sbchmn/Texas_Security_Company_Manager
      branch: main
      deploy_on_push: true
    dockerfile_path: Dockerfile
    source_dir: /
    # Same passes as the compose worker, so a platform deploy chases the same obligations. Each is
    # idempotent and `|| true`-guarded: one failing pass must not stop notification delivery.
    # This spec previously ran only compliance_reminders, which left recurring posts, missing-punch
    # reports, onboarding chases, stale-move closure and daily figures unattended on App Platform.
    run_command: sh -c "while true; do python manage.py compliance_reminders || true; python manage.py generate_recurring_posts || true; python manage.py report_missing_punches || true; python manage.py onboarding_reminders || true; python manage.py close_stale_moves || true; python manage.py monitor_attendance || true; python manage.py capture_reports || true; python manage.py process_notifications || true; sleep 60; done"
    instance_count: 1
    envs:
      - key: SECRET_KEY
        type: SECRET
      - key: ALLOWED_HOSTS
        value: ${APP_DOMAIN}
      - key: PUBLIC_BASE_URL
        value: "https://${APP_DOMAIN}"
      - key: MYSQL_HOST
        value: ${tscm-db.HOSTNAME}
      - key: MYSQL_PORT
        value: ${tscm-db.PORT}
      - key: MYSQL_DATABASE
        value: ${tscm-db.DATABASE}
      - key: MYSQL_USER
        value: ${tscm-db.USERNAME}
      - key: MYSQL_PASSWORD
        value: ${tscm-db.PASSWORD}
      # Verify the managed cluster's certificate (the driver alone would accept any certificate).
      - key: MYSQL_SSL_CA_PEM
        value: ${tscm-db.CA_CERT}
      - key: MYSQL_SSL_MODE
        value: verify_identity
      - key: REDIS_URL
        value: ${tscm-cache.DATABASE_URL}
      - key: RUN_MIGRATIONS
        value: "0"
      # The worker never uploads files, so it does not need the scanner configuration.
      - key: MALWARE_SCAN_MODE
        value: basic
      - key: AWS_STORAGE_BUCKET_NAME
        value: replace-with-your-spaces-bucket
      - key: AWS_S3_ENDPOINT_URL
        value: https://replace-with-your-space-region.digitaloceanspaces.com
      - key: AWS_S3_REGION_NAME
        value: replace-with-your-space-region
      - key: AWS_ACCESS_KEY_ID
        type: SECRET
      - key: AWS_SECRET_ACCESS_KEY
        type: SECRET
      - key: DEFAULT_FROM_EMAIL
        value: alerts@example.com
      # This worker's process_notifications pass is what actually sends queued email and texts,
      # so it needs the same provider credentials as the web service.
      - key: POSTMARK_SERVER_TOKEN
        type: SECRET
      - key: MAILJET_API_KEY
        type: SECRET
      - key: MAILJET_SECRET_KEY
        type: SECRET
      - key: TWILIO_ACCOUNT_SID
        type: SECRET
      - key: TWILIO_AUTH_TOKEN
        type: SECRET
      - key: TWILIO_FROM_NUMBER
        value: ""
