name: texas-security-company-manager
services:
  - name: web
    dockerfile_path: Dockerfile
    source_dir: /
    http_port: 8000
    instance_count: 1
    health_check:
      http_path: /readyz
    routes:
      - path: /
    envs:
      - key: SECRET_KEY
        type: SECRET
      - key: ALLOWED_HOSTS
        value: ${APP_DOMAIN}
      - key: MYSQL_HOST
        value: ${tscm-db.HOSTNAME}
      - key: MYSQL_PORT
        value: ${tscm-db.PORT}
      - key: MYSQL_DATABASE
        value: ${tscm-db.DATABASE}
      - key: MYSQL_USER
        value: ${tscm-db.USERNAME}
      - key: MYSQL_PASSWORD
        value: ${tscm-db.PASSWORD}
      - key: REDIS_URL
        value: ${tscm-cache.DATABASE_URL}
databases:
  - name: tscm-db
    engine: MYSQL
    production: false
  - name: tscm-cache
    engine: REDIS
    production: false

workers:
  - name: notifications
    dockerfile_path: Dockerfile
    source_dir: /
    run_command: sh -c "while true; do python manage.py compliance_reminders && python manage.py process_notifications; sleep 60; done"
    instance_count: 1
    envs:
      - key: SECRET_KEY
        type: SECRET
      - key: ALLOWED_HOSTS
        value: ${APP_DOMAIN}
      - key: MYSQL_HOST
        value: ${tscm-db.HOSTNAME}
      - key: MYSQL_PORT
        value: ${tscm-db.PORT}
      - key: MYSQL_DATABASE
        value: ${tscm-db.DATABASE}
      - key: MYSQL_USER
        value: ${tscm-db.USERNAME}
      - key: MYSQL_PASSWORD
        value: ${tscm-db.PASSWORD}
      - key: REDIS_URL
        value: ${tscm-cache.DATABASE_URL}
