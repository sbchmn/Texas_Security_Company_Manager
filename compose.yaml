services:
  web:
    build: .
    command: sh -c "python manage.py migrate && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --access-logfile -"
    env_file: [.env]
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      REDIS_URL: redis://cache:6379/0
      TRUST_PROXY_SSL_HEADER: "true"
      MALWARE_SCAN_MODE: clamav
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
    volumes: ["media:/app/media"]
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_started
      clamav:
        condition: service_healthy
  caddy:
    image: caddy:2-alpine
    ports:
      - "${TSCM_HTTP_PORT:-80}:80"
      - "${TSCM_HTTPS_PORT:-443}:443"
    environment:
      TSCM_SITE_ADDRESS: ${TSCM_SITE_ADDRESS:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web]
  worker:
    build: .
    command: sh -c "while true; do python manage.py compliance_reminders && python manage.py process_notifications; sleep 60; done"
    env_file: [.env]
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      REDIS_URL: redis://cache:6379/0
    volumes: ["media:/app/media"]
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_started
  cache:
    image: redis:7.4-alpine
    command: redis-server --save 60 1 --appendonly yes
    volumes: ["redis:/data"]
  clamav:
    image: clamav/clamav:stable
  db:
    image: mysql:8.4
    # Django migrations install deterministic tenant-integrity and audit triggers.
    # MySQL otherwise rejects CREATE TRIGGER for the application migration user
    # whenever binary logging is enabled (error 1419).
    command: ["--log-bin-trust-function-creators=1"]
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-tscm}
      MYSQL_USER: ${MYSQL_USER:-tscm}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-root-me}
    volumes: ["mysql:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-change-root-me}"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  mysql:
  media:
  redis:
  caddy_data:
  caddy_config:
